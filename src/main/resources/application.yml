server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false

spring:
  application:
    name: cybershield

# Cybershield rule configuration (all lists default to empty).
# Populate these in a later sprint when real detectors are ready.
cybershield:
  pay:
    signing-secret: ${UPI_SIGNING_SECRET:}
    cors-allowed-origin: ${CORS_ALLOWED_ORIGIN:}
  rules:
    urgency-keywords: []
    trusted-brands: []
    malicious-apps: []
